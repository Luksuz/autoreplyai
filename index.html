
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoReply AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <script>
        // Enhanced shim for process.env to prevent ReferenceErrors
        window.process = { 
            env: { 
                NODE_ENV: 'production',
                API_KEY: '' 
            },
            nextTick: (cb) => setTimeout(cb, 0),
            browser: true
        };
        
        // Debugging helper: show errors on screen if the app fails to boot
        window.onerror = function(msg, url, line, col, error) {
            const errorDiv = document.createElement('div');
            errorDiv.style = "position:fixed;bottom:20px;left:20px;right:20px;background:#fee2e2;color:#991b1b;padding:1rem;border-radius:0.5rem;border:1px solid #fecaca;z-index:9999;font-family:monospace;font-size:12px;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1)";
            errorDiv.innerHTML = `<strong>Runtime Error:</strong><br>${msg}<br><small>${url}:${line}:${col}</small>`;
            document.body.appendChild(errorDiv);
        };
    </script>
    <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0?external=react",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
    <script type="module" src="index.tsx"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
</body>
</html>
